name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # Step 3: Verify Python version
      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.tx
          python -m pip install pytest coverage pylint

      # Step 5: Run tests
      - name: Run tests
        run: |
          python -m pytest tests/ --maxfail=1 --disable-warnings -v

      # Step 6: Run lint
      - name: Run lint
        continue-on-error: true
        run: |
          pylint **/*.py

      # Step 7: Check code coverage
      - name: Check code coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report

      # Step 8: Run AI Agent to review PR
      - name: Run AI Agent to Review PR
        if: github.event_name == 'pull_request'
        run: |
          python .github/workflows/pr_review_agent.py
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
